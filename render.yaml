# Render Blueprint for the backend (NestJS API).
# Step-by-step guide: docs/despliegue.md
services:
  - type: web
    name: pasantias-api
    runtime: node
    plan: free
    # Same region as the Neon database (AWS us-east-1) to keep queries fast.
    region: virginia
    branch: main
    autoDeploy: true
    # Commands run from the repository root because this is an npm workspaces
    # monorepo with a single package-lock.json. devDependencies are needed to
    # build (Nest CLI, TypeScript, Prisma CLI). Pending migrations are applied
    # at the end of the build, so a failed migration never goes live.
    buildCommand: >-
      npm ci --include=dev --workspace=backend --include-workspace-root &&
      npm run build --workspace=backend &&
      npm run db:deploy --workspace=backend
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /api
    # Do not redeploy the API when only the frontend or the docs change.
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Neon connection string (the direct one, not the "pooled" one).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # URL of the frontend on Vercel, without a trailing slash.
      - key: CORS_ORIGIN
        sync: false
      # Base URL used in the links sent by email (verification, email change).
      - key: FRONTEND_URL
        value: https://proyecto-final-tupad-pasantias.vercel.app
      # Email is sent through Brevo's HTTPS API: the free plan blocks SMTP.
      # The API refuses to start in production without these two.
      - key: BREVO_API_KEY
        sync: false
      # Must be a verified sender in the Brevo account.
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Internship Portal
      # CVs and logos: a private Backblaze B2 bucket, through its S3-compatible
      # API. The API refuses to start in production without these.
      - key: S3_BUCKET
        sync: false
      # e.g. https://s3.us-east-005.backblazeb2.com
      - key: S3_ENDPOINT
        sync: false
      # e.g. us-east-005 (the part of the endpoint after "s3.")
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Public URL of this API, without /api; used in the links to the logos.
      - key: PUBLIC_API_URL
        value: https://pasantias-api.onrender.com
